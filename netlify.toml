[build]
  command = "npm run build"
  publish = "dist"

[context.production.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_PROJECT_ID"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200